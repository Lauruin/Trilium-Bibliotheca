<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bibliotheca — your Trilium vault as a library</title>
    <!-- Data-URL favicon: no file, no 404 console noise in the browser pass. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314101c'/%3E%3Crect x='3' y='3' width='3' height='10' fill='%23a04a3a'/%3E%3Crect x='7' y='3' width='3' height='10' fill='%235a6e8a'/%3E%3Crect x='11' y='3' width='2' height='10' fill='%235f8a5a'/%3E%3C/svg%3E" />
    <!-- use-credentials: the manifest must be fetched WITH cookies when an auth proxy
         (e.g. Pangolin SSO) sits in front, or installability silently fails. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#14101c" />
    <!--
      Inline critical style so the very first paint is already dark, before the
      game canvas and React overlay mount. Everything else lives in src/ui/styles.css.
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #0e0d16; height: 100%; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <!-- React overlay root: HUD, book popup, settings, search. Sits above the canvas. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
