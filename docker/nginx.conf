# nginx config for the Bibliotheca static bundle.
#
# House gotcha (AGENTS.md): nginx:alpine defaults to pid /var/nginx/nginx.pid
# and writes temp files under /var/cache/nginx — with a read-only rootfs this
# fails at startup with a bare "[emerg] open() ... failed (2)". So every
# writable path is pointed at /tmp, and compose.yml mounts tmpfs over /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logs to /tmp too (read-only rootfs).
  access_log /tmp/nginx-access.log;

  # All temp paths directly under /tmp — one level deep, because nginx
  # mkdir()s only the LEAF directory (it will not create /tmp/nginx/ first,
  # which on a fresh tmpfs doesn't exist and crashes startup with
  # '[emerg] mkdir() "/tmp/nginx/client_body" failed (2)'). /tmp itself is
  # guaranteed to exist (and is tmpfs-mounted in compose.yml).
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  tcp_nopush on;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  # Rendered at container start by /docker-entrypoint.d/30-biblio-config.sh from the host's environment (resolver, rate-limit zone).
  # The wildcard matters: a plain `include` of a missing file is an error, a wildcard that matches nothing is not.
  include /tmp/conf/http-*.conf;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # The shell must always be revalidated (asset hashes change with it).
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # Service worker and manifest must never be served stale.
    location = /sw.js {
      add_header Cache-Control "no-cache";
    }
    # `types` replaces the whole mapping inside a location, hence its own block.
    location = /manifest.webmanifest {
      types { application/manifest+json webmanifest; }
      add_header Cache-Control "no-cache";
    }

    # Hosted mode: the proxied Trilium (/etapi/) and AI (/ai/) locations, with the secrets, rendered at container start
    # (see docker/30-biblio-config.sh). Absent = a plain static site.
    include /tmp/conf/server-*.conf;

    # What the app may know about the host's configuration (no secrets): written at container start. Never cached.
    location = /config.json {
      alias /tmp/config.json;
      default_type application/json;
      add_header Cache-Control "no-store";
    }

    # Favicon is a data URL inside index.html — no file needed. Anything
    # unknown falls back to the shell (harmless for a single-page app).
    location / {
      try_files $uri /index.html;
    }
  }
}