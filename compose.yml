# compose.yml — disposable Trilium mock for development & testing.
#
# Per AGENTS.md: there is no shared Trilium mock; every Trilium instance on
# this machine is in real use, so this project stands up its own throwaway
# instance inside the DinD daemon. It is ours to break, wipe and recreate.
#
# Networking:
#   - Runs in the DinD daemon (DOCKER_HOST=tcp://dind:2375).
#   - Publishes 8080 (the app container takes 8081).
#   - From this container:   http://dind:8080
#   - From the host/laptop:  http://localhost:18080 (devcontainer sidecar maps 18080→8080)
#
# CORS (docs.triliumnotes.org → Configuration → CORS, since v0.93.0):
#   The app fetches Trilium directly from the browser, so the mock allows
#   every origin and the auth/content-type headers. `*` is fine for a
#   throwaway instance with test data — never do this on a real one.
#
# Image (docs.triliumnotes.org → Server Installation → Using Docker):
#   triliumnext/trilium, pinned tag — docs warn against `latest` (it can
#   upgrade your instance under you). v0.106.0 = current release at build
#   time, verified against GitHub releases before being written here.
#
# Data: named volume `trilium-mock-data` → /home/node/trilium-data, so
# `docker compose restart` keeps test data; delete the volume for a clean
# slate (tools/trilium-bootstrap.sh --recreate does exactly that).
#
# The `bibliotheca` service below is the APP ITSELF, hosted: the static
# production bundle (multi-stage build via Dockerfile) served by nginx on
# **8081**. It is stateless — the browser fetches Trilium directly, so this
# container holds no token and needs no volumes. The Trilium mock's CORS
# `*` makes the cross-origin fetch from the app's origin (any port) work;
# on a real instance you'd allow this origin instead (see README).
#
# Note the read_only rootfs + tmpfs /tmp pair, and that nginx's writable
# paths are redirected to /tmp in docker/nginx.conf — see the nginx gotcha
# in AGENTS.md.

services:
  bibliotheca:
    build: .
    image: bibliotheca-web:latest
    container_name: bibliotheca-web
    restart: unless-stopped
    ports:
      - "8081:80"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      trilium:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  trilium:
    image: triliumnext/trilium:v0.106.0
    container_name: bibliotheca-trilium-mock
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # CORS for the browser-based app (see note above).
      TRILIUM_NETWORK_CORS_ALLOW_ORIGIN: "*"
      TRILIUM_NETWORK_CORS_ALLOW_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      TRILIUM_NETWORK_CORS_ALLOW_HEADERS: "Authorization,Content-Type"
    volumes:
      - trilium-mock-data:/home/node/trilium-data
    healthcheck:
      # A fresh instance serves the setup page with 200; an initialized one
      # serves the login page. Either way, "200 on /" means Trilium is up.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  trilium-mock-data: